[project]
name = "forest-disturbance-detection"
version = "0.1.0"
description = "Scalable forest disturbance detection: Sentinel-2 features, PySpark preparation, autoencoder anomaly detection (IT741A)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "earthengine-api>=1.4",
    "pyspark>=3.5,<3.6",
    "tensorflow>=2.17,<2.21",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "pyyaml>=6",
    "psutil>=6",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fdd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
